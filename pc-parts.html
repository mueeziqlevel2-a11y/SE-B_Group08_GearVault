<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GearVault PC Parts - Genuine computer hardware, processors, graphics cards, motherboards, and memory in Pakistan.">
  <title>PC Parts &amp; Hardware | GearVault</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Shared CSS Architecture -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">

  <style>
    :is(a, button, input, select, textarea, [tabindex]):focus-visible {
      outline: 2px solid var(--gv-cyan) !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.35) !important;
    }
  </style>
</head>
<body>
  <div id="gv-navbar-container"></div>

  <main class="gv-section py-5">
    <div class="container">
      <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between gap-3 mb-4">
        <div>
          <span class="gv-badge gv-badge-deal mb-2"><i class="bi bi-cpu"></i> HARDWARE VAULT</span>
          <h1 class="text-white fs-2 mb-1" style="font-family: var(--gv-font-heading);">
            PC PARTS &amp; <span class="gradient-text-cyan-violet">COMPONENTS</span>
          </h1>
          <p class="text-secondary small mb-0">Browse verified CPUs, GPUs, motherboards, and memory in PKR.</p>
        </div>
        <div class="d-flex gap-2">
          <a href="pages/pc-builder.html" class="gv-btn gv-btn-violet gv-btn-sm"><i class="bi bi-tools"></i> Open PC Builder</a>
          <a href="pages/prebuilt-pcs.html" class="gv-btn gv-btn-glass gv-btn-sm"><i class="bi bi-pc-display"></i> Pre-Builts</a>
        </div>
      </div>

      <div id="pc-parts-grid" class="row g-4">
        <!-- Populated by JS -->
      </div>
    </div>
  </main>

  <div id="gv-footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data/products.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/ui.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof renderGameVaultNavbar === 'function') renderGameVaultNavbar('pc-parts');
      if (typeof renderGameVaultFooter === 'function') renderGameVaultFooter();

      const container = document.getElementById('pc-parts-grid');
      const parts = (typeof GAMEVAULT_PRODUCTS !== 'undefined') ? GAMEVAULT_PRODUCTS.filter(p => p.category === 'pc-parts') : [];

      if (container) {
        container.innerHTML = parts.map(p => `
          <div class="col-sm-6 col-lg-4 col-xl-3">
            <div class="gv-card h-100 d-flex flex-column p-3">
              <div class="text-center p-3 mb-2 rounded" style="background:#090e18;">
                <img src="${p.image}" alt="${p.name}" class="img-fluid" style="height:150px;object-fit:contain;"
                     onerror="if(typeof handleImgError==='function')handleImgError(this,'${p.name}')">
              </div>
              <span class="badge bg-dark border border-cyan text-cyan align-self-start small mb-1">${p.brand || 'GearVault'}</span>
              <h4 class="text-white fs-6 mb-2 text-truncate" title="${p.name}">${p.name}</h4>
              <div class="text-secondary small mb-3 text-truncate">${p.shortDescription || ''}</div>
              <div class="mt-auto pt-2 border-top border-secondary border-opacity-25 d-flex align-items-center justify-content-between">
                <span class="text-cyan fw-bold font-monospace">${typeof formatPKR==='function'?formatPKR(p.price):'Rs. '+p.price}</span>
                <button class="gv-btn gv-btn-sm gv-btn-cyan" onclick="if(typeof StorageManager!=='undefined'){StorageManager.addToCart('${p.id}',1);if(typeof showToast==='function')showToast('${p.name} added to cart!','success');}">
                  <i class="bi bi-cart-plus"></i> Add
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }
    });
  </script>
</body>
</html>
