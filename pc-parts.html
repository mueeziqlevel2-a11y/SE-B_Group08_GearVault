<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GAMEVAULT PC Parts Catalog - Processors, Graphics Cards, Motherboards, RAM, NVMe SSDs, and Power Supplies in Pakistan. Group 08 Project.">
  <title>PC Parts Catalog | GAMEVAULT</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Shared GameVault CSS Architecture -->
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body>

  <!-- Dynamic Shared Navbar -->
  <div id="gv-navbar-container"></div>

  <!-- Page Header -->
  <section class="py-4 border-bottom border-secondary border-opacity-25" style="background: radial-gradient(circle at 10% 50%, rgba(0, 212, 255, 0.08) 0%, transparent 60%);">
    <div class="container">
      <nav class="mb-2" aria-label="breadcrumb">
        <ol class="breadcrumb small mb-0">
          <li class="breadcrumb-item"><a href="index.html" class="text-secondary">Home</a></li>
          <li class="breadcrumb-item active text-cyan" aria-current="page">PC Parts</li>
        </ol>
      </nav>
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2">
        <div>
          <h1 class="h2 text-white mb-1">PC HARDWARE CATALOG</h1>
          <p class="text-secondary small mb-0">High-performance processors, graphics cards, motherboards, and cooling solutions in PKR</p>
        </div>
        <div class="d-flex align-items-center gap-2">
          <button id="gv-open-filters-btn" class="gv-btn gv-btn-glass gv-btn-sm d-lg-none">
            <i class="bi bi-funnel"></i> Filters
          </button>
          <a href="pc-builder.html" class="gv-btn gv-btn-violet gv-btn-sm">
            <i class="bi bi-tools"></i> Open PC Builder
          </a>
        </div>
      </div>
    </div>
  </section>

  <!-- Main Catalog Content -->
  <section class="gv-section py-4">
    <div class="container">
      <div class="row g-4">
        
        <!-- Filter Sidebar (Responsive Drawer on Mobile) -->
        <div id="gv-filter-backdrop" class="gv-drawer-backdrop"></div>
        <div id="gv-filter-sidebar" class="col-lg-3 gv-filter-drawer">
          <div class="gv-card p-3 p-md-4 sticky-top" style="top: 90px;">
            <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary border-opacity-25">
              <h5 class="mb-0 text-white"><i class="bi bi-funnel text-cyan me-1"></i> Filter Parts</h5>
              <button id="gv-close-filters-btn" class="btn btn-sm btn-link text-secondary d-lg-none" aria-label="Close Filters">
                <i class="bi bi-x-lg fs-5"></i>
              </button>
            </div>

            <!-- Category Filter -->
            <div class="gv-form-group mb-3">
              <label class="gv-label small">Component Type</label>
              <select id="catalog-category-filter" class="gv-select py-2">
                <option value="all">All PC Components</option>
                <option value="cpu">Processors (CPU)</option>
                <option value="gpu">Graphics Cards (GPU)</option>
                <option value="motherboard">Motherboards</option>
                <option value="ram">Memory (RAM)</option>
                <option value="storage">Storage (NVMe SSD)</option>
                <option value="psu">Power Supplies (PSU)</option>
                <option value="cooling">CPU Coolers</option>
                <option value="case">Cases / Cabinets</option>
              </select>
            </div>

            <!-- Price Slider -->
            <div class="gv-form-group mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label class="gv-label small mb-0">Max Budget</label>
                <span id="catalog-price-val" class="text-cyan small fw-bold font-monospace">Rs. 700,000</span>
              </div>
              <input type="range" class="form-range" id="catalog-price-slider" min="10000" max="700000" step="5000" value="700000">
              <div class="d-flex justify-content-between text-muted" style="font-size: 0.72rem;">
                <span>Rs. 10,000</span>
                <span>Rs. 700,000+</span>
              </div>
            </div>

            <!-- In-Stock Filter -->
            <div class="form-check form-switch mb-3">
              <input class="form-check-input" type="checkbox" id="catalog-instock-only">
              <label class="form-check-label text-secondary small" for="catalog-instock-only">In Stock Items Only</label>
            </div>

            <!-- Brand Filter -->
            <div class="gv-form-group mb-3">
              <label class="gv-label small">Hardware Brands</label>
              <div id="catalog-brand-list" style="max-height: 180px; overflow-y: auto; padding-right: 4px;">
                <!-- Populated dynamically by catalog.js -->
              </div>
            </div>

            <!-- Reset Button -->
            <button id="catalog-reset-filters" class="gv-btn gv-btn-glass w-100 py-2 small mt-2">
              <i class="bi bi-arrow-counterclockwise"></i> Reset All Filters
            </button>
          </div>
        </div>

        <!-- Product Grid & Search Toolbar -->
        <div class="col-lg-9">
          <!-- Toolbar -->
          <div class="gv-card p-3 mb-4">
            <div class="row g-2 align-items-center justify-content-between">
              <!-- Search Input -->
              <div class="col-md-7">
                <div class="input-group">
                  <span class="input-group-text bg-dark border-secondary text-secondary">
                    <i class="bi bi-search"></i>
                  </span>
                  <input type="text" id="catalog-search-input" class="gv-input py-2" placeholder="Search CPU, RTX 4070, DDR5, AM5, Corsair...">
                </div>
              </div>

              <!-- Sort Dropdown -->
              <div class="col-md-5">
                <div class="d-flex align-items-center justify-content-md-end gap-2">
                  <span class="small text-secondary text-nowrap">Sort:</span>
                  <select id="catalog-sort-select" class="gv-select py-2 small" style="min-width: 175px;">
                    <option value="default">Featured / Default</option>
                    <option value="price-asc">Price: Low to High</option>
                    <option value="price-desc">Price: High to Low</option>
                    <option value="popularity">Most Popular</option>
                    <option value="rating-desc">Highest Rated</option>
                  </select>
                </div>
              </div>
            </div>

            <!-- Active Count Summary -->
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top border-secondary border-opacity-25 small text-secondary">
              <span id="catalog-count" class="text-cyan fw-bold">Loading components...</span>
              <span class="d-none d-sm-inline"><i class="bi bi-shield-check text-cyan me-1"></i> Authentic Hardware with PKR Rates</span>
            </div>
          </div>

          <!-- Product Grid -->
          <div id="catalog-products-grid" class="row g-4">
            <!-- Dynamically populated by catalog.js -->
          </div>
        </div>

      </div>
    </div>
  </section>

  <!-- Dynamic Shared Footer -->
  <div id="gv-footer-container"></div>

  <!-- Bootstrap 5 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- GameVault Core Data & Scripts -->
  <script src="js/data/products.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/ui.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>
  <script src="js/pages/catalog.js"></script>

</body>
</html>
