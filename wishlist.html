<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GearVault Saved Wishlist - Track your favorite gaming hardware and dream PC battlestation components.">
  <title>Saved Wishlist | GearVault</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/pages.css">

  <style>
    :is(a, button, input, select, textarea, [tabindex]):focus-visible {
      outline: 2px solid var(--gv-cyan) !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.35) !important;
    }
  </style>
</head>
<body>
  <div id="gv-navbar-container"></div>

  <main class="gv-section py-5">
    <div class="container">
      <div class="mb-4">
        <h1 class="text-white fs-2 mb-1" style="font-family: var(--gv-font-heading);">
          <i class="bi bi-heart text-danger me-2"></i> Saved Wishlist
        </h1>
        <p class="text-secondary small">Your saved PC parts and peripherals saved across browsing sessions.</p>
      </div>

      <div id="wishlist-container" class="row g-4">
        <!-- Rendered by JS -->
      </div>
    </div>
  </main>

  <div id="gv-footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data/products.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/ui.js"></script>
  <script src="js/components/navbar.js"></script>
  <script src="js/components/footer.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof renderGameVaultNavbar === 'function') renderGameVaultNavbar('wishlist');
      if (typeof renderGameVaultFooter === 'function') renderGameVaultFooter();

      const container = document.getElementById('wishlist-container');
      const wishlist = (typeof StorageManager !== 'undefined') ? StorageManager.getWishlist() : [];

      if (!wishlist || wishlist.length === 0) {
        if (container) {
          container.innerHTML = `
            <div class="col-12 text-center py-5">
              <i class="bi bi-heart text-muted fs-1 mb-3 d-block"></i>
              <h4 class="text-white mb-2">Your Wishlist is Empty</h4>
              <p class="text-secondary small mb-3">Save items while browsing hardware to review them later.</p>
              <a href="pages/pc-builder.html" class="gv-btn gv-btn-cyan gv-btn-sm me-2"><i class="bi bi-tools"></i> PC Builder</a>
              <a href="pages/prebuilt-pcs.html" class="gv-btn gv-btn-glass gv-btn-sm"><i class="bi bi-pc-display"></i> Pre-Builts</a>
            </div>
          `;
        }
      } else {
        if (container) {
          container.innerHTML = wishlist.map(id => {
            const prod = (typeof getProductById === 'function') ? getProductById(id) : null;
            if (!prod) return '';
            return `
              <div class="col-sm-6 col-lg-4 col-xl-3">
                <div class="gv-card h-100 p-3">
                  <img src="${prod.image}" alt="${prod.name}" class="img-fluid rounded mb-2" style="height:140px;object-fit:contain;"
                       onerror="if(typeof handleImgError==='function')handleImgError(this,'${prod.name}')">
                  <h5 class="text-white fs-6 mb-1 text-truncate">${prod.name}</h5>
                  <div class="text-cyan fw-bold font-monospace mb-2">${typeof formatPKR==='function'?formatPKR(prod.price):'Rs. '+prod.price}</div>
                  <div class="d-flex gap-2 mt-auto">
                    <button class="gv-btn gv-btn-sm gv-btn-cyan flex-grow-1" onclick="StorageManager.addToCart('${prod.id}',1);if(typeof showToast==='function')showToast('Added to cart!','success');">
                      <i class="bi bi-cart-plus"></i> Add
                    </button>
                    <button class="gv-btn gv-btn-sm gv-btn-glass text-danger" onclick="StorageManager.removeFromWishlist('${prod.id}');location.reload();">
                      <i class="bi bi-trash3"></i>
                    </button>
                  </div>
                </div>
              </div>
            `;
          }).join('');
        }
      }
    });
  </script>
</body>
</html>
