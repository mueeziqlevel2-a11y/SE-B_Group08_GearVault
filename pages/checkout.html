<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GearVault Express Checkout - Finalize your custom gaming gear and PC hardware order with simulated payment gateways.">
  <title>Express Checkout | GearVault - High-Performance Battlestations</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

  <!-- Shared GearVault CSS Architecture -->
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/pages.css">

  <style>
    :is(a, button, input, select, textarea, [tabindex]):focus-visible {
      outline: 2px solid var(--gv-cyan) !important;
      outline-offset: 2px !important;
      box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.35) !important;
    }
  </style>
</head>
<body>

  <!-- Dynamic Shared Navbar -->
  <div id="gv-navbar-container"></div>

  <main class="gv-section py-5">
    <div class="container">
      <div class="mb-4">
        <h1 class="text-white fs-2 mb-1" style="font-family: var(--gv-font-heading);">
          <i class="bi bi-shield-lock text-cyan me-2"></i> Express Checkout
        </h1>
        <p class="text-secondary small">Academic Simulation &bull; Group 08 Semester Project</p>
      </div>

      <div class="row g-4">
        <div class="col-lg-7">
          <div class="gv-card p-4 mb-4">
            <h4 class="text-white fs-5 mb-3"><i class="bi bi-person-badge text-cyan me-2"></i> Shipping Information</h4>
            <form id="checkout-form">
              <div class="row g-3">
                <div class="col-sm-6">
                  <label class="form-label text-secondary small">Full Name</label>
                  <input type="text" class="gv-input" id="cust-name" required placeholder="Ahmad Khan">
                </div>
                <div class="col-sm-6">
                  <label class="form-label text-secondary small">Email Address</label>
                  <input type="email" class="gv-input" id="cust-email" required placeholder="ahmad@example.com">
                </div>
                <div class="col-12">
                  <label class="form-label text-secondary small">Delivery Address</label>
                  <input type="text" class="gv-input" id="cust-address" required placeholder="House #, Street, Sector...">
                </div>
                <div class="col-sm-6">
                  <label class="form-label text-secondary small">City</label>
                  <input type="text" class="gv-input" id="cust-city" required placeholder="Islamabad / Lahore / Karachi">
                </div>
                <div class="col-sm-6">
                  <label class="form-label text-secondary small">Contact Phone</label>
                  <input type="tel" class="gv-input" id="cust-phone" required placeholder="0300-1234567">
                </div>
              </div>

              <h4 class="text-white fs-5 mt-4 mb-3"><i class="bi bi-credit-card text-violet me-2"></i> Simulated Payment Method</h4>
              <div class="d-flex flex-column gap-2 mb-4">
                <label class="p-3 rounded d-flex align-items-center gap-3" style="background:#090e18;border:1px solid var(--gv-border-neon);cursor:pointer;">
                  <input type="radio" name="payment" value="cod" checked>
                  <div>
                    <strong class="text-white">Cash on Delivery (Verified)</strong>
                    <div class="small text-secondary">Pay upon physical hardware inspection at doorstep.</div>
                  </div>
                </label>
                <label class="p-3 rounded d-flex align-items-center gap-3" style="background:#090e18;border:1px solid var(--gv-border-subtle);cursor:pointer;">
                  <input type="radio" name="payment" value="bank">
                  <div>
                    <strong class="text-white">1Link Direct Bank Transfer</strong>
                    <div class="small text-secondary">Simulated electronic instant transfer with order reference.</div>
                  </div>
                </label>
              </div>

              <button type="submit" class="gv-btn gv-btn-cyan w-100 py-3">
                <i class="bi bi-lock-fill"></i> Confirm &amp; Place Simulated Order
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-5">
          <div class="gv-card p-4">
            <h4 class="text-white fs-5 mb-3"><i class="bi bi-receipt text-cyan me-2"></i> Order Summary</h4>
            <div id="checkout-items-list" class="mb-3">
              <!-- Rendered by JS -->
            </div>
            <div class="d-flex justify-content-between pt-2 border-top border-secondary border-opacity-25 mb-2">
              <span class="text-secondary">Subtotal</span>
              <span id="checkout-subtotal" class="text-white font-monospace">Rs. 0</span>
            </div>
            <div class="d-flex justify-content-between mb-2">
              <span class="text-secondary">GST (5%)</span>
              <span id="checkout-tax" class="text-white font-monospace">Rs. 0</span>
            </div>
            <div class="d-flex justify-content-between mb-3">
              <span class="text-secondary">Express Delivery</span>
              <span class="text-success fw-bold font-monospace">FREE</span>
            </div>
            <div class="d-flex justify-content-between pt-3 border-top border-secondary border-opacity-25 fs-5 fw-bold">
              <span class="text-white">Grand Total</span>
              <span id="checkout-grand-total" class="text-cyan font-monospace">Rs. 0</span>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="gv-footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data/products.js"></script>
  <script src="../js/data/prebuilts-data.js"></script>
  <script src="../js/utils/storage.js"></script>
  <script src="../js/utils/ui.js"></script>
  <script src="../js/components/navbar.js"></script>
  <script src="../js/components/footer.js"></script>
  <script src="../js/utils/gearvault-pages.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof GearVaultPages !== 'undefined') {
        GearVaultPages.initNestedLayout('checkout');
      }

      const cart = (typeof GearVaultPages !== 'undefined') ? GearVaultPages.readCart() : [];
      let subtotal = 0;
      const listEl = document.getElementById('checkout-items-list');

      if (cart.length === 0) {
        if (listEl) listEl.innerHTML = '<div class="text-muted small">Your cart is currently empty.</div>';
      } else {
        if (listEl) {
          listEl.innerHTML = cart.map(item => {
            const resolved = (typeof GearVaultPages !== 'undefined') ? GearVaultPages.resolveCartItem(item) : item;
            const price = Number(resolved.price || 0);
            const qty = item.quantity || 1;
            subtotal += price * qty;
            return `
              <div class="d-flex justify-content-between align-items-center mb-2 small">
                <span class="text-truncate text-white me-2">${resolved.name} &times; ${qty}</span>
                <span class="text-cyan font-monospace text-nowrap">${typeof formatPKR === 'function' ? formatPKR(price * qty) : 'Rs. ' + (price * qty)}</span>
              </div>
            `;
          }).join('');
        }
      }

      const tax = Math.round(subtotal * 0.05);
      const grandTotal = subtotal + tax;

      const subEl = document.getElementById('checkout-subtotal');
      const taxEl = document.getElementById('checkout-tax');
      const totalEl = document.getElementById('checkout-grand-total');

      if (subEl) subEl.textContent = typeof formatPKR === 'function' ? formatPKR(subtotal) : 'Rs. ' + subtotal;
      if (taxEl) taxEl.textContent = typeof formatPKR === 'function' ? formatPKR(tax) : 'Rs. ' + tax;
      if (totalEl) totalEl.textContent = typeof formatPKR === 'function' ? formatPKR(grandTotal) : 'Rs. ' + grandTotal;

      const form = document.getElementById('checkout-form');
      if (form) {
        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const orderId = 'GV-' + Math.floor(10000 + Math.random() * 90000);
          const order = {
            orderId,
            createdAt: new Date().toISOString(),
            status: 'Processing',
            customer: document.getElementById('cust-name')?.value || 'Valued Customer',
            email: document.getElementById('cust-email')?.value || '',
            total: grandTotal,
            items: cart
          };

          if (typeof StorageManager !== 'undefined') {
            const orders = StorageManager.getOrders();
            orders.unshift(order);
            StorageManager.saveOrders(orders);
            StorageManager.clearCart();
          }
          if (typeof GearVaultPages !== 'undefined') {
            GearVaultPages.clearCart();
          }

          if (typeof showToast === 'function') {
            showToast(`Order ${orderId} placed successfully!`, 'success');
          }
          setTimeout(() => {
            window.location.href = `order-tracking.html?orderId=${orderId}`;
          }, 800);
        });
      }
    });
  </script>
</body>
</html>
